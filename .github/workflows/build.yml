name: Build signed APK
on:
  workflow_dispatch:
    inputs:
      verify:
        description: "Run the level bot first (about 1 hour, then builds the APK with its fixes)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['game.zip', 'bot/**', 'app/**', 'build.gradle.kts', 'settings.gradle.kts', '.github/workflows/build.yml']
permissions:
  contents: write
jobs:
  verify:
    if: ${{ github.event.inputs.verify == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        a: [0, 100, 200, 300, 400, 500, 600, 700, 800, 900]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Unpack game.zip
        run: unzip -o game.zip -x ".github/*"
      - name: Bot solves levels (all 16 traps per level)
        run: TW=1 node tools/solver.js ${{ matrix.a }} $(( ${{ matrix.a }} + 100 ))
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.a }}
          path: salts_*.json

  merge:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Unpack game.zip
        run: unzip -o game.zip -x ".github/*"
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true
      - name: Merge bot results into bot/salts.js
        run: |
          node tools/merge.js
          mkdir -p bot && cp salts.js bot/salts.js
          git config user.name "level-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot/salts.js
          git commit -m "Bot: level fixes" || true
          git push

  apk:
    needs: [verify, merge]
    if: ${{ always() && (needs.merge.result == 'success' || needs.merge.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KSP: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate keystore (first run only)
        if: env.KS_B64 == ''
        run: |
          P=$(openssl rand -hex 12)
          keytool -genkeypair -v -keystore flux.jks -alias flux -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$P" -keypass "$P" -dname "CN=Flux Runner, O=Game, C=IN"
          base64 -w0 flux.jks > KEYSTORE_BASE64.txt
          echo -n "$P" > KEYSTORE_PASSWORD.txt
          mkdir save && mv KEYSTORE_BASE64.txt KEYSTORE_PASSWORD.txt save/
      - name: Upload keystore for safekeeping
        if: env.KS_B64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: SAVE-THESE-2-SECRETS
          path: save/
      - name: Stop - add secrets
        if: env.KS_B64 == ''
        run: |
          echo "Download artifact SAVE-THESE-2-SECRETS, add its two files as repo secrets KEYSTORE_BASE64 and KEYSTORE_PASSWORD, then re-run this workflow."
          exit 1

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }

      - name: Unpack game.zip (every file goes to its right place)
        run: |
          if [ -f game.zip ]; then unzip -o game.zip -x ".github/*" "tools/*" "PRIVACY.md"; fi
          if [ -f bot/salts.js ]; then cp bot/salts.js salts.js; fi

      - name: Copy game files into app
        run: |
          mkdir -p app/src/main/assets
          cp index.html lang.js salts.js manifest.json sw.js icon.svg app/src/main/assets/
          echo "$KS_B64" | tr -d '[:space:]' | base64 -d > flux.jks
          echo "KSP_CLEAN=$(echo -n "$KSP" | tr -d '[:space:]')" >> $GITHUB_ENV

      - name: Build signed APK
        env:
          VC: ${{ github.run_number }}
          KS_PATH: ${{ github.workspace }}/flux.jks
          KSP: ${{ env.KSP_CLEAN }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FluxRunner.apk

      - uses: actions/upload-artifact@v4
        with: { name: FluxRunner-apk, path: FluxRunner.apk }
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Flux Runner v1.${{ github.run_number }}
          files: FluxRunner.apk
