name: Build signed APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'manifest.json', 'sw.js', 'icon.svg', 'app/**', 'build.gradle.kts', 'settings.gradle.kts', '.github/workflows/build.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KSP: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate keystore (first run only)
        if: env.KS_B64 == ''
        run: |
          P=$(openssl rand -hex 12)
          keytool -genkeypair -v -keystore flux.jks -alias flux -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$P" -keypass "$P" -dname "CN=Flux Runner, O=Game, C=IN"
          base64 -w0 flux.jks > KEYSTORE_BASE64.txt
          echo -n "$P" > KEYSTORE_PASSWORD.txt
          mkdir save && mv KEYSTORE_BASE64.txt KEYSTORE_PASSWORD.txt save/
      - name: Upload keystore for safekeeping
        if: env.KS_B64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: SAVE-THESE-2-SECRETS
          path: save/
      - name: Stop - add secrets
        if: env.KS_B64 == ''
        run: |
          echo "Download artifact SAVE-THESE-2-SECRETS, add its two files as repo secrets KEYSTORE_BASE64 and KEYSTORE_PASSWORD, then re-run this workflow."
          exit 1

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }

      - name: Copy game files into app
        run: |
          mkdir -p app/src/main/assets
          cp index.html manifest.json sw.js icon.svg app/src/main/assets/
          echo "$KS_B64" | tr -d '[:space:]' | base64 -d > flux.jks
          echo "KSP_CLEAN=$(echo -n "$KSP" | tr -d '[:space:]')" >> $GITHUB_ENV

      - name: Build signed APK
        env:
          VC: ${{ github.run_number }}
          KS_PATH: ${{ github.workspace }}/flux.jks
          KSP: ${{ env.KSP_CLEAN }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FluxRunner.apk

      - uses: actions/upload-artifact@v4
        with: { name: FluxRunner-apk, path: FluxRunner.apk }
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Flux Runner v1.${{ github.run_number }}
          files: FluxRunner.apk
